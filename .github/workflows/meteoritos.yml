name: Meteoritos - CI y CD
run-name: "CI/CD meteoritos - ${{ github.event_name }} por ${{ github.actor }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI - Verificacion (pruebas, validacion y generacion del sitio)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener los archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias (si existe requirements.txt)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No hay requirements.txt: el proyecto usa solo la biblioteca estandar."
          fi

      - name: Ejecutar pruebas automatizadas
        run: python -m unittest discover -v

      - name: Validar el CSV completo y generar el informe web
        run: python analizar.py

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Guardar el sitio generado como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  cd:
    name: CD - Publicacion (solo si CI termino correctamente)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
